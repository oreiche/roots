repos:
    - repo: local
      hooks:
          - id: verify-eval
            name: verify-eval
            entry: bash
            # do a matrix test across supported series and channels
            args:
              - -c
              - |
                set -euo pipefail

                CHANNELS=("daily" "release")

                for c in "${CHANNELS[@]}"; do
                  echo "==> channel='$c'"
                  zazu eval . --set "channel=$c"
                done
            language: system
            files: \.star$
            pass_filenames: false
